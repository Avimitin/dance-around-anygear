[project]
name = "dance-around-anygear-spike-research"
version = "0.1.0"
description = "Pinned CUDA environment for D430-domain SPiKE fine-tuning"
requires-python = "==3.10.*"
dependencies = [
    "numpy==2.2.6",
    "torch==2.11.0+cu128",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
